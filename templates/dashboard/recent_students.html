<h2>Recent student registrations</h2>
<div class="table-wrap">
  <table>
    <thead><tr><th>Student</th><th>Student ID</th><th>Course</th><th>Batch</th></tr></thead>
    <tbody>
      {% for student in recent_students %}
        <tr>
          <td><a href="{% url 'students:detail' student.pk %}">{{ student.user.get_full_name|default:student.user.username }}</a></td>
          <td>{{ student.student_id }}</td><td>{{ student.batch.course.name }}</td><td>{{ student.batch.name }}</td>
        </tr>
      {% empty %}<tr><td colspan="4" class="empty">No students registered yet.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
